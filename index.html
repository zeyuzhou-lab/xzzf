            let html = '';
            filtered.forEach(q => {
                const options = [];
                for (let i=0; i<6; i++) {
                    const letter = String.fromCharCode(65+i);
                    if (q[`选项${letter}`]) options.push({ letter, text: q[`选项${letter}`] });
                }
                html += `<div class="card"><div class="card-header"><span class="q-type">${q.题型}</span><span class="q-category">${q.所属分类 || ''}</span><span class="q-difficulty">🔥 ${q.难度||'简单'}</span></div><div class="q-title">${q.题目}</div><div class="options-grid">`;
                options.forEach(opt => html += `<div class="option-item"><span class="option-prefix">${opt.letter}.</span><span class="option-text">${opt.text}</span></div>`);
                html += `</div><div class="answer-area"><button class="toggle-answer-btn">🔒 显示答案</button><div class="answer-detail" style="display:none;"><div class="correct-answer">✅ 正确答案：${q.正确答案}</div><div class="analysis">📖 ${q.解析}</div></div></div></div>`;
            });
            container.innerHTML = html;
            document.querySelectorAll('.toggle-answer-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const detail = this.nextElementSibling;
                    if (detail.style.display === 'none') {
                        detail.style.display = 'block';
                        this.textContent = '🔓 隐藏答案';
                    } else {
                        detail.style.display = 'none';
                        this.textContent = '🔒 显示答案';
                    }
                });
            });
        }

        [categorySelect, typeSelect, difficultySelect].forEach(el => el.addEventListener('change', render));
        searchInput.addEventListener('input', render);
        resetBtn.addEventListener('click', () => {
            categorySelect.value = 'all';
            typeSelect.value = 'all';
            difficultySelect.value = 'all';
            searchInput.value = '';
            render();
        });
        render();
    })();
</script>
</body>
</html>
